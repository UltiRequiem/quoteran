name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install poetry
          poetry install

      # Run inside the Poetry venv so pylint can import the dependencies.
      - name: Run pylint
        run: poetry run pylint quoteran tests

      - name: Run the tests
        run: poetry run python -m unittest discover -s tests -t .

  ci:
    name: CI
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
